<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard KPI de tareo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}
:root{--bg:#070b14;--card:rgba(16,25,43,.74);--tx:#e8f0ff;--mu:#7f93b5;--ln:rgba(120,160,255,.17);--cy:#22d3ee;--mg:#ff3d8b;--ye:#fbbf24;--ok:#34e8a5;--vi:#8b5cf6;color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.45 "Exo 2","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 500px at 88% -10%,rgba(34,211,238,.17),transparent),radial-gradient(700px 500px at -8% 8%,rgba(139,92,246,.2),transparent),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/48px 48px;opacity:.4;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
header,main{position:relative}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,rgba(34,211,238,.1),transparent 60%)}
h1{font-size:28px;margin:0;font-weight:700;letter-spacing:.5px;text-shadow:0 0 22px rgba(34,211,238,.55)}.sub{color:var(--mu);font-size:12px}
button,.btn,select,input{font:inherit;color:var(--tx);background:rgba(10,16,30,.8);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;min-height:36px}
input:focus,select:focus,.ms summary:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{cursor:pointer;background:linear-gradient(135deg,var(--cy),var(--vi));color:#031018;border:0;font-weight:700;box-shadow:0 0 18px rgba(34,211,238,.4)}
main{padding:20px 28px;max-width:1360px;margin:auto}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
label,.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cy);box-shadow:0 0 14px var(--cy)}
.k.m::before{background:var(--mg);box-shadow:0 0 14px var(--mg)}.k.y::before{background:var(--ye);box-shadow:0 0 14px var(--ye)}.k.t::before{background:var(--vi);box-shadow:0 0 14px var(--vi)}
.k b{display:block;font-size:34px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(34,211,238,.45)}.k.m b{text-shadow:0 0 18px rgba(255,61,139,.5)}.k span{font-size:12px;color:var(--mu)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:18px}.grid3 .panel{margin:0}
.panel{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.panel h2{font-size:16px;margin:0 0 8px;font-weight:600}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mu);font-weight:600;position:sticky;top:0;background:#0e1627}
tr.p td{font-weight:700;background:rgba(34,211,238,.08)}tr.c td:first-child{padding-left:28px;color:var(--mu)}tr.c:hover td,tr.p:hover td{background:rgba(139,92,246,.14)}
.bar{display:inline-block;width:90px;height:8px;background:rgba(255,61,139,.3);border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi))}
.g{color:var(--ok)}.w{color:var(--ye)}.r{color:var(--mg)}
.row{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.row div:nth-child(2){height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}.row i{display:block;height:100%;background:linear-gradient(90deg,var(--ye),var(--mg))}
.row div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row div:last-child{text-align:right;color:var(--mu)}
.rk{display:grid;grid-template-columns:120px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.rk>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk>div:last-child{text-align:right;font-weight:700}
.rt{display:flex;height:12px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}.rt i{background:linear-gradient(90deg,var(--vi),var(--cy));box-shadow:0 0 10px rgba(34,211,238,.5)}.rt u{background:var(--mg);box-shadow:0 0 10px var(--mg)}
.lg{font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}.lg i:first-child{margin-left:0}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;flex:none}.dl{flex:1;min-width:140px;font-size:13px}.dl div{display:flex;align-items:center;gap:8px;margin:3px 0}.dl i{width:10px;height:10px;border-radius:3px;flex:none}.dl b{margin-left:auto;color:var(--mu);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mu)}
.ms{position:relative}.ms summary{list-style:none;cursor:pointer;border:1px solid var(--ln);border-radius:8px;padding:6px 10px;min-height:36px;background:rgba(10,16,30,.8);color:var(--tx);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms summary::after{content:' ▾';color:var(--mu)}.ms[open] summary{border-color:var(--cy);box-shadow:0 0 12px rgba(34,211,238,.35)}
.opts{position:absolute;z-index:5;top:40px;left:0;min-width:270px;max-height:280px;overflow:auto;background:#0e1627;border:1px solid var(--ln);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.opts label{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:13px;padding:3px 4px;cursor:pointer}.opts .clr{display:block;font-size:12px;color:var(--cy);padding:2px 4px 6px}
.opts .q{width:100%;margin-bottom:6px;position:sticky;top:0}
.opts input[type=checkbox]{min-height:0;padding:0;width:16px;height:16px;accent-color:#22d3ee}
</style></head><body>
<header><div><h1>Centro de control de producción</h1><div class="sub" id="info"></div></div>
<label class="btn" style="flex-direction:row;color:#fff">Cargar Excel<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label></header>
<main>
<section class="filters">
  <label>Desde<input type="datetime-local" id="f-d1"></label>
  <label>Hasta<input type="datetime-local" id="f-d2"></label>
<div class="f">Máquinas<details class="ms" id="f-maq"><summary></summary><div class="opts"></div></details></div><div class="f">Operadores<details class="ms" id="f-oper"><summary></summary><div class="opts"></div></details></div>
<div class="f">OP<details class="ms" id="f-op"><summary></summary><div class="opts"></div></details></div><label>Descripción contiene<input id="f-desc" placeholder="texto..."></label>
</section>
<section class="kpis" id="kpis"></section>
<section class="grid3"><div class="panel"><h2>Producción diaria y % calidad</h2><div id="ch-trend"></div></div><div class="panel"><h2 id="ch-rank-t">Ranking</h2><div id="ch-rank"></div><div class="lg"><i style="background:var(--cy)"></i>Buena <i style="background:var(--mg)"></i>Mala · % calidad a la derecha</div></div><div class="panel"><h2>Distribución del tiempo</h2><div id="ch-donut" class="dn"></div></div></section>
<section class="panel">
<div class="tools"><label>Comparativa<select id="vista">
<option value="om">Operador › Máquina</option><option value="mo">Máquina › Operador</option>
<option value="o">Operadores (de la máquina filtrada)</option><option value="m">Máquinas (del operador filtrado)</option></select></label>
<div class="sub" id="hint"></div></div>
<div class="wrap" id="tabla"></div></section>
<section class="panel"><h2>Minutos por proceso</h2><div class="sub" style="margin-bottom:8px">Dónde se va el tiempo con los filtros actuales</div><div id="procs"></div></section>
</main>

 $('#kpis').innerHTML=[['','Cantidad buena',nf(all.b)],['m','Cantidad mala',nf(all.m)],['','% calidad (buena / total)',pc(cal(all))],['y','Minutos de producción',nf(all.pmin)],['y','Buenas por hora productiva',bph(all)==null?'–':nf(bph(all))],['t','% tiempo en producción',pc(ut(all))]].map(([c,l,v])=>`<div class="k ${c}"><b>${v}</b><span>${l}</span></div>`).join('');
 const v=$('#vista').value,P={om:['oper','maq'],mo:['maq','oper'],o:['oper'],m:['maq']}[v];
 $('#hint').textContent={om:'Cada operador y, debajo, las máquinas donde trabajó',mo:'Cada máquina y, debajo, los operadores que la usaron',o:'Compara operadores; marca una o varias máquinas en el filtro para acotar',m:'Compara máquinas; marca uno o varios operadores en el filtro para acotar'}[v];
 let h='';for(const a of agg(L,P[0])){h+=tr(a,a.k,'p');if(P[1])for(const c of agg(a.rows,P[1]))h+=tr(c,c.k,'c')}
 $('#tabla').innerHTML=L.length?`<table><thead><tr><th>${P[1]?'Grupo / detalle':P[0]=='oper'?'Operador':'Máquina'}</th><th>Buena</th><th>Mala</th><th>% calidad</th><th>Min. prod.</th><th>Buenas/h</th><th>% t. prod.</th></tr></thead><tbody>${h}</tbody></table>`:'<div class="empty">Sin registros con estos filtros. Amplía las fechas o limpia algún filtro.</div>';
 const ps=agg(L,'proc'),mx=Math.max(1,...ps.map(a=>a.min)),sorted=ps.sort((a,b)=>b.min-a.min);
 charts(L,P);$('#procs').innerHTML=sorted.map(a=>`<div class="row"><div title="${a.k}">${a.k}</div><div><i style="width:${a.min/mx*100}%"></i></div><div>${nf(a.min)} min</div></div>`).join('')}
['#f-d1','#f-d2','#f-desc','#vista'].forEach(s=>$(s).addEventListener('input',render));
if(typeof DATA!=='undefined')setRows(DATA.map(r=>({op:r[0],desc:r[1],d:r[2],oper:r[3],maq:r[4],proc:r[5],min:r[6],b:r[7],m:r[8]})),'EJEMPLO.xlsx (datos de muestra)');
else setRows([],'Sin datos · carga un Excel');

function charts(L,P){
 const D=agg(L,'d').filter(a=>a.k).sort((a,b)=>a.k<b.k?-1:1),n=D.length;
 if(!n){['#ch-trend','#ch-rank','#ch-donut'].forEach(s=>$(s).innerHTML='<div class="empty">Sin datos con estos filtros</div>');return}
 const W=640,H=210,p=26,mx=Math.max(1,...D.map(a=>a.b)),bw=(W-2*p)/n,lo=Math.max(0,Math.min(...D.map(cal).filter(c=>c!=null),99)-1);
 const bars=D.map((a,i)=>{const h=a.b/mx*(H-2*p);return `<rect x="${p+i*bw+(bw-Math.min(Math.max(1,bw*.76),28))/2}" y="${H-p-h}" width="${Math.min(Math.max(1,bw*.76),28)}" height="${h}" rx="2" fill="url(#g1)"><title>${a.k}: ${nf(a.b)} buenas, ${nf(a.m)} malas</title></rect>`}).join('');
 const pts=D.map((a,i)=>cal(a)==null?null:[(p+i*bw+bw/2).toFixed(1),(H-p-(cal(a)-lo)/(100-lo)*(H-2*p)).toFixed(1)]).filter(Boolean);
 const line=`<polyline points="${pts.join(' ')}" fill="none" stroke="${C.mg}" stroke-width="2" style="filter:drop-shadow(0 0 4px ${C.mg})"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.5" fill="${C.mg}"/>`).join('');
 $('#ch-trend').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.cy}"/><stop offset="1" stop-color="${C.vi}" stop-opacity=".5"/></linearGradient></defs>${bars}${line}<text x="${p}" y="${H-7}" fill="#7f93b5" font-size="11">${D[0].k}</text><text x="${W-p}" y="${H-7}" fill="#7f93b5" font-size="11" text-anchor="end">${D[n-1].k}</text></svg><div class="lg"><i style="background:${C.cy}"></i>Cantidad buena por día <i style="background:${C.mg}"></i>% calidad (escala ${lo.toFixed(0)}–100%)</div>`;
 const R=agg(L,P[0]).slice(0,10),rm=Math.max(1,...R.map(a=>a.b+a.m));
 $('#ch-rank-t').textContent='Ranking por '+(P[0]=='oper'?'operador':'máquina')+' (top 10)';
 $('#ch-rank').innerHTML=R.map(a=>`<div class="rk"><div title="${esc(a.k)}">${esc(a.k)}</div><div class="rt"><i style="width:${a.b/rm*100}%"></i><u style="width:${a.m/rm*100}%"></u></div><div class="${cls(cal(a))}">${pc(cal(a))}</div></div>`).join('');
 const S=agg(L,'proc').sort((a,b)=>b.min-a.min),tot=S.reduce((s,a)=>s+a.min,0)||1,col=[C.cy,C.mg,C.ye,C.vi,C.ok,'#64748b'];
 const top=S.slice(0,5),rest=tot-top.reduce((s,a)=>s+a.min,0),sl=rest>0?[...top,{k:'Otros',min:rest}]:top,r=52,cc=2*Math.PI*r;let off=0;
 const arcs=sl.map((a,i)=>{const f=a.min/tot,e=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${col[i]}" stroke-width="16" stroke-dasharray="${f*cc} ${cc}" stroke-dashoffset="${-off*cc}" transform="rotate(-90 70 70)"/>`;off+=f;return e}).join('');
 const pr=L.filter(x=>isProd(x.proc)).reduce((s,x)=>s+x.min,0)/tot*100;
 $('#ch-donut').innerHTML=`<svg viewBox="0 0 140 140">${arcs}<text x="70" y="68" text-anchor="middle" fill="#e8f0ff" font-size="22" font-weight="700">${pr.toFixed(0)}%</text><text x="70" y="86" text-anchor="middle" fill="#7f93b5" font-size="9">en producción</text></svg><div class="dl">${sl.map((a,i)=>`<div><i style="background:${col[i]}"></i>${esc(a.k)}<b>${(a.min/tot*100).toFixed(0)}%</b></div>`).join('')}</div>`}

document.addEventListener('input',e=>{if(!e.target.classList.contains('q'))return;const t=norm(e.target.value);e.target.closest('.opts').querySelectorAll('label').forEach(l=>l.style.display=norm(l.textContent).includes(t)?'':'none')});
document.addEventListener('toggle',e=>{if(e.target.open){const q=e.target.querySelector('.q');if(q)q.focus()}},true);
</script></body></html>
